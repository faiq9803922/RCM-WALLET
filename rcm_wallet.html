<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RCM WALLET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --maroon-dark: #2A0810;
            --maroon-main: #4A0E1C;
            --maroon-light: #6A1428;
            --gold-light: #FCEABB;
            --gold-main: #D4AF37;
            --gold-dark: #AA771C;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--maroon-dark);
            color: #ffffff;
            overflow: hidden; /* Prevent body scroll, handle inside app container */
            -webkit-tap-highlight-color: transparent;
        }

        /* Metallic Gold Gradients */
        .gold-gradient-bg {
            background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold-light) 50%, var(--gold-main) 100%);
            color: var(--maroon-dark);
        }
        
        .gold-gradient-text {
            background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gold-border {
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
        }
        
        .gold-border-focus:focus {
            outline: none;
            border-color: var(--gold-main);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* Cards & UI Elements */
        .glass-card {
            background: linear-gradient(145deg, rgba(74, 14, 28, 0.9), rgba(42, 8, 16, 0.95));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 16px;
        }

        .btn-gold {
            background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7);
            color: #2A0810;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        
        .btn-gold:active {
            transform: scale(0.98);
        }

        /* Nav Tab Active State */
        .nav-item {
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.6);
        }
        .nav-item.active {
            color: var(--gold-light);
            text-shadow: 0 0 10px rgba(252, 234, 187, 0.8);
            transform: translateY(-2px);
        }
        .nav-item.active svg {
            filter: drop-shadow(0 0 5px rgba(252, 234, 187, 0.8));
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hide scrollbar for clean app look */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Loader */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--gold-main);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased selection:bg-yellow-600 selection:text-white">

        <!-- Toast Notification Container -->
        <div id="toast-container" class="absolute top-5 left-0 right-0 z-[100] flex flex-col items-center gap-2 pointer-events-none px-4"></div>

                </div>

                    <label class="flex items-center cursor-pointer">
