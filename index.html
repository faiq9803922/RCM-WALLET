<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <!-- Admin Login Gateway -->
    <div id="login-screen">
        <div class="login-box">
            <h2>ADMIN ACCESS</h2>
            <input type="password" id="admin-pass" placeholder="Enter Password">
            <button id="login-btn">LOGIN</button>
            <p id="login-error">Incorrect Password</p>
        </div>
    </div>

    <!-- Admin Dashboard (Hidden by default) -->
    <div id="dashboard-screen" style="display: none;">
        <header>
            <h2>Tournament Management</h2>
            <button id="logout-btn">Logout</button>
        </header>

        <div class="dashboard-content">
            <!-- Add Tournament Form -->
            <div class="panel-card">
                <h3>Add New Tournament</h3>
                <input type="text" id="t-name" placeholder="Tournament Name (e.g., ALPHA BATTLE)">
                <input type="date" id="t-date">
                
                <label for="t-image">Upload Poster Image:</label>
                <input type="file" id="t-image" accept="image/*">
                
                <button id="add-btn">Upload & Add Tournament</button>
                <p id="upload-status" style="display: none; color: #ffeb3b; margin-top: 10px;">Uploading... Please wait.</p>
            </div>

            <!-- Active Tournaments List -->
            <div class="panel-card">
                <h3>Active Tournaments</h3>
                <div id="tournaments-list">
                    <!-- Tournaments will render here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module" src="admin.js"></script>
</body>
</html>
